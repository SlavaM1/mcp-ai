services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mcp_ai}
      POSTGRES_USER: ${POSTGRES_USER:-mcp_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mcp_ai_local}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  weather-mcp:
    build:
      context: weather-mcp
      dockerfile: Dockerfile
      target: runtime
    environment:
      WEATHER_DATABASE_PATH: /data/weather.db
      WEATHER_REPORTS_DIRECTORY: /data/reports
      WEATHER_BASE_URL: ${WEATHER_BASE_URL:-https://wttr.in}
      WEATHER_HTTP_TIMEOUT_SECONDS: ${WEATHER_HTTP_TIMEOUT_SECONDS:-15}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1},db,backend,frontend,weather-mcp,currency-mcp,travel-mcp,report-mcp
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.build_opener(urllib.request.ProxyHandler({})).open('http://127.0.0.1:8001/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    ports:
      - "${WEATHER_MCP_PORT:-8001}:8001"
    volumes:
      - weather_mcp_data:/data
    restart: unless-stopped

  currency-mcp:
    build:
      context: currency-mcp
      dockerfile: Dockerfile
      target: runtime
    environment:
      CURRENCY_BASE_URL: ${CURRENCY_BASE_URL:-https://open.er-api.com/v6/latest}
      CURRENCY_HTTP_TIMEOUT_SECONDS: ${CURRENCY_HTTP_TIMEOUT_SECONDS:-10}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1},db,backend,frontend,weather-mcp,currency-mcp,travel-mcp,report-mcp
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.build_opener(urllib.request.ProxyHandler({})).open('http://127.0.0.1:8002/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    ports:
      - "${CURRENCY_MCP_PORT:-8002}:8002"
    restart: unless-stopped

  travel-mcp:
    build:
      context: travel-mcp
      dockerfile: Dockerfile
      target: runtime
    environment:
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1},db,backend,frontend,weather-mcp,currency-mcp,travel-mcp,report-mcp
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.build_opener(urllib.request.ProxyHandler({})).open('http://127.0.0.1:8003/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    ports:
      - "${TRAVEL_MCP_PORT:-8003}:8003"
    restart: unless-stopped

  report-mcp:
    build:
      context: report-mcp
      dockerfile: Dockerfile
      target: runtime
    environment:
      REPORTS_DIRECTORY: /data/reports
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1},db,backend,frontend,weather-mcp,currency-mcp,travel-mcp,report-mcp
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.build_opener(urllib.request.ProxyHandler({})).open('http://127.0.0.1:8004/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    ports:
      - "${REPORT_MCP_PORT:-8004}:8004"
    volumes:
      - report_mcp_reports:/data/reports
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://mcp_ai:mcp_ai_local@db:5432/mcp_ai}
      MCP_SERVER_URL: ${MCP_SERVER_URL:-http://weather-mcp:8001/mcp}
      MCP_SERVERS: '${MCP_SERVERS:-{"weather":"http://weather-mcp:8001/mcp","currency":"http://currency-mcp:8002/mcp","travel":"http://travel-mcp:8003/mcp","report":"http://report-mcp:8004/mcp"}}'
      MCP_TIMEOUT_SECONDS: ${MCP_TIMEOUT_SECONDS:-30}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
      MAX_TOOL_CALLS: ${MAX_TOOL_CALLS:-12}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4201}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1},db,backend,frontend,weather-mcp,currency-mcp,travel-mcp,report-mcp
    depends_on:
      db:
        condition: service_healthy
      weather-mcp:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.build_opener(urllib.request.ProxyHandler({})).open('http://localhost:8000/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: runtime
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-Y", "off", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "${FRONTEND_PORT:-4201}:80"
    restart: unless-stopped

  backend-test:
    profiles: ["test"]
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: test
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://mcp_ai:mcp_ai_local@db:5432/mcp_ai}
      MCP_SERVER_URL: ${MCP_SERVER_URL:-http://weather-mcp:8001/mcp}
      MCP_SERVERS: '${MCP_SERVERS:-{"weather":"http://weather-mcp:8001/mcp","currency":"http://currency-mcp:8002/mcp","travel":"http://travel-mcp:8003/mcp","report":"http://report-mcp:8004/mcp"}}'
      MCP_TIMEOUT_SECONDS: ${MCP_TIMEOUT_SECONDS:-30}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
      MAX_TOOL_CALLS: ${MAX_TOOL_CALLS:-12}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1},db,backend,frontend,weather-mcp,currency-mcp,travel-mcp,report-mcp
    depends_on:
      db:
        condition: service_healthy

  weather-mcp-test:
    profiles: ["test"]
    build:
      context: weather-mcp
      dockerfile: Dockerfile
      target: test

  currency-mcp-test:
    profiles: ["test"]
    build:
      context: currency-mcp
      dockerfile: Dockerfile
      target: test
    environment:
      CURRENCY_BASE_URL: ${CURRENCY_BASE_URL:-https://open.er-api.com/v6/latest}
      CURRENCY_HTTP_TIMEOUT_SECONDS: ${CURRENCY_HTTP_TIMEOUT_SECONDS:-10}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1},db,backend,frontend,weather-mcp,currency-mcp,travel-mcp,report-mcp

  travel-mcp-test:
    profiles: ["test"]
    build:
      context: travel-mcp
      dockerfile: Dockerfile
      target: test
    environment:
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1},db,backend,frontend,weather-mcp,currency-mcp,travel-mcp,report-mcp

  report-mcp-test:
    profiles: ["test"]
    build:
      context: report-mcp
      dockerfile: Dockerfile
      target: test
    environment:
      REPORTS_DIRECTORY: /data/reports
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1},db,backend,frontend,weather-mcp,currency-mcp,travel-mcp,report-mcp

volumes:
  postgres_data:
    name: mcp-ai-postgres-data
  weather_mcp_data:
    name: mcp-ai-weather-mcp-data
  report_mcp_reports:
    name: mcp-ai-report-mcp-reports
